spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:h2:mem:analytics
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.aiurlshortener.analytics: INFO