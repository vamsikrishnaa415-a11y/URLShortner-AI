spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: url-service
          uri: ${URL_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/urls/**
        - id: url-redirect
          uri: ${URL_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/{shortCode:[0-9A-Za-z]{8}}
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/analytics/**,/analytics/events/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: WARN