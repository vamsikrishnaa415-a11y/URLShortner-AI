spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: url-service
          uri: http://localhost:8081
          predicates:
            - Path=/url/**
        - id: analytics-service
          uri: http://localhost:8082
          predicates:
            - Path=/analytics/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info